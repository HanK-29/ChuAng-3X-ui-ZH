name: Import ChuAng source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Unpack and commit source
        shell: bash
        run: |
          set -euo pipefail
          test -f ChuAng-3X-ui-ZH.zip
          unzip -q ChuAng-3X-ui-ZH.zip -d "$RUNNER_TEMP/chuang"
          source_dir="$RUNNER_TEMP/chuang/ChuAng-3X-ui-ZH"
          test -f "$source_dir/install.sh"
          test -f "$source_dir/go.mod"
          rsync -a --exclude='/.github/' "$source_dir/" ./
          git rm -- ChuAng-3X-ui-ZH.zip
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import ChuAng source"
          git push
